<!doctype html>
<!-- Visuel publicitaire 16:9 (1920x1080) : peu de texte, beaucoup d'air, un seul appel à l'action.
     Rendu : chrome --headless --window-size=1920,1080 --screenshot=princess-buster-promo.png promo.html -->
<html lang="fr">
<head>
<meta charset="utf-8">
<title>PBuster - visuel promo</title>
<style>
  :root { --gold: #ffd23f; --gold-l: #fff3a0; --magenta: #ff3fa4; --purple: #3b0a6e; --violet: #7a2cff; --sky: #5fd4ff; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0a0838; font-family: 'Baloo 2', 'Arial Rounded MT Bold', 'Segoe UI Black', 'Trebuchet MS', Arial, sans-serif; color: #fff; }
  .scene { position: relative; width: 1920px; height: 1080px; overflow: hidden;
    background:
      radial-gradient(ellipse 760px 700px at 1370px 540px, rgba(255, 63, 164, .62), transparent 70%),
      radial-gradient(ellipse 1000px 700px at 10% 0%, rgba(122, 44, 255, .7), transparent 65%),
      linear-gradient(#1c1478, #130d5e 60%, #0a0838); }
  .rays { position: absolute; left: 1370px; top: 540px; }
  .rays i { position: absolute; left: -110px; top: -1300px; width: 220px; height: 1300px; transform-origin: 110px 1300px; background: linear-gradient(rgba(255,255,255,.09), transparent 80%); }
  .stars { position: absolute; inset: 0;
    background-image:
      radial-gradient(3px 3px at 6% 12%, #fff, transparent), radial-gradient(2px 2px at 20% 78%, var(--gold-l), transparent),
      radial-gradient(3px 3px at 33% 18%, var(--sky), transparent), radial-gradient(2px 2px at 44% 90%, #fff, transparent),
      radial-gradient(2px 2px at 52% 8%, var(--gold-l), transparent), radial-gradient(3px 3px at 60% 60%, #fff, transparent),
      radial-gradient(2px 2px at 95% 10%, var(--gold-l), transparent), radial-gradient(3px 3px at 97% 90%, #fff, transparent); }

  /* colonne de gauche : beaucoup d'air, 4 éléments seulement */
  .left { position: absolute; left: 130px; top: 0; width: 760px; height: 1080px; display: flex; flex-direction: column; justify-content: center; }
  .logo { width: 170px; border-radius: 19%; filter: drop-shadow(0 14px 24px rgba(0,0,0,.5)) drop-shadow(0 0 40px rgba(255, 210, 63, .55)); transform: rotate(-4deg); }
  h1 { margin-top: 36px; font-size: 98px; line-height: 1; font-weight: 900; text-transform: uppercase; letter-spacing: -1px;
    background: linear-gradient(#fffbd0, var(--gold) 55%, #f59a00); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 8px 0 var(--purple)) drop-shadow(0 0 30px rgba(255, 63, 164, .7)); }
  h1 span { display: block; background: linear-gradient(#ffc2ea, var(--magenta) 60%, #b0126b); -webkit-background-clip: text; background-clip: text; }
  .sub { margin-top: 36px; font-size: 36px; font-weight: 700; color: #efeaff; text-shadow: 0 3px 0 rgba(59,10,110,.9); letter-spacing: .5px; }
  .cta { margin-top: 50px; align-self: flex-start; display: flex; align-items: center; gap: 24px; padding: 18px 50px 18px 34px; font-size: 50px; font-weight: 900; border-radius: 44px; border: 6px solid var(--purple);
    background: linear-gradient(#a6ff7a, #3fd62f 50%, #18a02a); color: #fff; text-shadow: 0 4px 0 var(--purple);
    box-shadow: 0 12px 0 var(--purple), 0 0 0 5px #d6ffb8 inset, 0 0 60px rgba(70, 255, 100, .65); }
  .cta .arrow { width: 64px; height: 64px; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center; font-size: 46px; color: #18a02a; text-shadow: none; box-shadow: 0 5px 0 rgba(0,0,0,.25); }
  .mini { margin-top: 26px; margin-left: 12px; font-size: 28px; font-weight: 700; color: var(--gold-l); text-shadow: 0 2px 0 var(--purple); }

  /* captures de jeu : 3 cartes bien séparées */
  .card { position: absolute; border-radius: 44px; overflow: hidden; border: 10px solid var(--gold); background: var(--purple);
    box-shadow: 0 0 0 6px var(--purple), 0 34px 70px rgba(0,0,0,.6), 0 0 80px rgba(255, 63, 164, .55); }
  .card img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .c1 { left: 940px; top: 215px; width: 360px; height: 640px; transform: rotate(-9deg); }
  .c3 { left: 1560px; top: 205px; width: 360px; height: 640px; transform: rotate(9deg); }
  .c2 { left: 1210px; top: 95px; width: 480px; height: 853px; z-index: 2; }
  .tile { position: absolute; width: 92px; height: 92px; padding: 14px; background: #fffbea; border: 4px solid var(--purple); border-radius: 26px; box-shadow: 0 8px 0 var(--purple), 0 0 34px rgba(255, 210, 63, .85); z-index: 3; }
  .tile img { width: 100%; height: 100%; }
  .badge { position: absolute; z-index: 4; left: 1600px; top: 72px; width: 200px; height: 200px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    background: radial-gradient(circle at 35% 30%, #ffe0f3, var(--magenta) 55%, #b0126b); border: 8px solid var(--gold); box-shadow: 0 0 0 5px var(--purple), 0 12px 30px rgba(0,0,0,.5), 0 0 40px rgba(255, 63, 164, .8); transform: rotate(10deg); text-shadow: 0 3px 0 var(--purple); }
  .badge b { font-size: 84px; line-height: 1; font-weight: 900; }
  .badge small { font-size: 30px; font-weight: 800; }
  .spark { position: absolute; color: var(--gold-l); text-shadow: 0 0 18px var(--gold); font-size: 56px; z-index: 5; }
</style>
</head>
<body>
<div class="scene">
  <div class="rays">
    <i style="transform: rotate(-70deg)"></i><i style="transform: rotate(-45deg)"></i><i style="transform: rotate(-22deg)"></i><i style="transform: rotate(0deg)"></i>
    <i style="transform: rotate(22deg)"></i><i style="transform: rotate(45deg)"></i><i style="transform: rotate(70deg)"></i>
  </div>
  <div class="stars"></div>

  <div class="left">
    <img class="logo" src="../../public/assets/logo.png" alt="PBuster">
    <h1>Fais tomber<span>toutes les technos !</span></h1>
    <p class="sub">Gratuit · sans pub · open source</p>
    <div class="cta"><div class="arrow">⬇</div>Jouer gratuitement</div>
    <p class="mini">Mobile · PC · 250 niveaux · 50 technos et IA</p>
  </div>

  <div class="card c1"><img src="shot-home.png" alt=""></div>
  <div class="card c3"><img src="shot-win.png" alt=""></div>
  <div class="card c2"><img src="shot-game.png" alt=""></div>

  <div class="tile" style="left: 1090px; top: 70px; transform: rotate(-12deg)"><img src="../../public/assets/tech/html5.svg" alt=""></div>
  <div class="tile" style="left: 880px; top: 560px; transform: rotate(10deg)"><img src="../../public/assets/tech/javascript.svg" alt=""></div>
  <div class="tile" style="left: 1740px; top: 560px; transform: rotate(-8deg)"><img src="../../public/assets/tech/react.svg" alt=""></div>
  <div class="tile" style="left: 1240px; top: 930px; transform: rotate(14deg)"><img src="../../public/assets/tech/python.svg" alt=""></div>
  <div class="tile" style="left: 1500px; top: 920px; transform: rotate(-10deg)"><img src="../../public/assets/tech/docker.svg" alt=""></div>
  <div class="tile" style="left: 1030px; top: 880px; transform: rotate(-6deg)"><img src="../../public/assets/tech/php.svg" alt=""></div>

  <div class="badge"><b>250</b><small>niveaux</small></div>
  <div class="spark" style="left: 1150px; top: 330px">✦</div>
  <div class="spark" style="left: 1830px; top: 470px; font-size: 42px">✦</div>
  <div class="spark" style="left: 940px; top: 120px; font-size: 40px">✦</div>
</div>
</body>
</html>
